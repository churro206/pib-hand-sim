id: EXP-006
titel: Objektmasse wie Dexsuite (0,04–0,4 kg)
datum: '2026-10-07'
eltern: EXP-004
status: trainiert
# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Mit schwereren Objekten im Training (wie Dexsuite) reicht der Pinzettengriff
  nicht mehr; die Policy lernt, mehr Finger einzusetzen (Fingerzahl > 2) und hält
  auch die leichteren Bewertungsobjekte sicherer. Risiko: Servo-Grenzen (2,94 Nm)
  — schwere Dosen evtl. nicht haltbar, Aufgabenerfolg könnte sinken. Bewertung in
  der unveränderten eval-v1-Umgebung (Zylinder 0,05–0,2 kg, ≤ 45°), direkt mit EXP-004
  vergleichbar.'
aenderung: 'Trainingsmasse der Dose 0,04–0,4 kg statt 0,05–0,2 kg (Dexsuite: 0,2 kg
  × 0,2–2; Task Pib-Grasp-Hand-Left-Heavy-v0).'
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
protokoll: eval-v1
entscheidungsregel: standard    # README → „Statistik und Entscheidungsregel“

# --- Training ---
training:
  task: Pib-Grasp-Hand-Left-Heavy-v0
  iterationen: 300
