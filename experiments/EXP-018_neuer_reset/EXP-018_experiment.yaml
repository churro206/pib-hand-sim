# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'EXP-013 trainierte schon fast ohne Überlappung (Finger 0–4°, Platzierung
  nach Bounding Box); der neue Reset ändert fürs Training nur Daumen-MCP, Handgelenk
  und den Abstand gedrehter Quader. Erwartet: Leistung im KI von EXP-013 unter eval-v2
  (83 % [80–87]), Zuverlässigkeit ähnlich (3/5) — die neue Basis für alle folgenden
  Experimente, damit jedes wieder genau eine Änderung hat. Gemessen nach Auswertung
  v2 gegen EXP-013 (eval-v2), dazu Testobjekte inkl. YCB.'
aenderung: 'Reset ohne Überlappung (ADR-021): Startbeugung Daumen-MCP 0–4° statt 0–15°,
  Handgelenk −1–0° statt −3–0°, Abstand zur Handfläche nach der Gierdrehung (reset_object_gap_aware).
  Sonst wie EXP-013 (HeavyMulti-v0, 300 It. × 1024, 5 Seeds); YCB-Bedingungen nur
  in der Bewertung.'
