# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-021
titel: Critic kennt Objektgröße, Masse und Reibung (privilegiert, wie HORA)
datum: '2026-10-09'
eltern: EXP-018
status: trainiert
# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Im Training mit 18 Formen und Masse 0,04–0,4 kg kennt der Critic das Objekt
  nicht (nur Lage/Geschwindigkeit). Mit Größe, Masse und Reibung (wie HORA, Dexsuite:
  Punktwolke) schätzt er Werte genauer → stabileres Lernen, erwartet mehr erfolgreiche
  Seeds und bessere Leistung auf schweren/großen Objekten (YCB) als EXP-018.'
aenderung: 'Critic-Beobachtung um mdp.object_properties ergänzt: halbe Tiefe, halbe
  Breite, Höhe (Bounding Box inkl. Zufallsgröße), Masse, Haft-/Gleitreibung (Task
  HeavyMultiPriv-v0). Actor unverändert. Sonst wie EXP-018.'
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d6
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: zylinder_d8_seitlich
  objekt: Zylinder Ø 8 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d8
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: quader_seitlich
  objekt: Quader 7 × 7 × 20 cm (±10 %), Fläche zur Hand ±15°, 0,05–0,2 kg (Benchmark)
  objekt_id: quader_7x7x20
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: flasche_seitlich
