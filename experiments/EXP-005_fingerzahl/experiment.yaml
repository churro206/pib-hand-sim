# experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-005
titel: Kontaktbelohnung nach Fingerzahl
datum: '2026-10-07'
eltern: EXP-004
status: ausgewertet
# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'EXP-004 hält mit genau 2 Fingern (Daumen + einer), weil der Gegengriff-Term
  nur das verlangt. Eine zusätzliche Belohnung, die mit der Zahl der Finger an der
  Dose steigt, führt zu einem Kraftgriff: mittlere Fingerzahl deutlich > 2, Kippwinkel
  kleiner (mehr Auflagepunkte), Griffkraft je Finger kleiner; Aufgabenerfolg mindestens
  wie EXP-004. Bewertung in der unveränderten eval-v1-Umgebung (Zylinder 0,05–0,2
  kg, ≤ 45°), direkt mit EXP-004 vergleichbar.'
aenderung: Zusätzlicher Belohnungsterm finger_count = 1 · (Finger mit Objektkontakt
  > 1 N)/4 · 𝟙[Daumen in Kontakt], ganze Episode (Task Pib-Grasp-Hand-Left-FingerCount-v0).
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
protokoll: eval-v1
entscheidungsregel: standard    # README → „Statistik und Entscheidungsregel“

# --- Training ---
training:
  task: Pib-Grasp-Hand-Left-FingerCount-v0
  iterationen: 300
  umgebungen: 1024
  seeds:          # 45, 46 nachgetragen 2026-10-08 (Regel 5 Seeds)
  - 42
  - 43
  - 44
  - 45
  - 46
  zusatz_args: []
fenstertest: false
