# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-020
titel: Aktionen auf ±1 begrenzt (clip_actions, Ersatz für NVIDIAs bounds_loss)
datum: '2026-10-09'
eltern: EXP-018
status: geplant                 # geplant | läuft | ausgewertet | verworfen

# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Ohne Begrenzung überzieht die Policy weit über die Servo-Sättigung (|a|
  2–3), Aktionsstrafen und Unruhe messen vor allem Rauschen und Überziehen (ADR-022).
  Mit Aktionen auf ±1 (Ersatz für NVIDIAs bounds_loss im rl_games-Dexsuite) bestraft
  die Strafe echten Aufwand: erwartet weniger Unruhe wirksam und weniger Stall/Griffkraft
  bei gleicher Leistung wie EXP-018.'
aenderung: 'Aktionen auf [−1, 1] begrenzt: rsl_rl clip_actions = 1.0 (Agent PibGraspPPORunnerCfg_Clip,
  Task HeavyMultiClip-v0), damit auch Aktionsstrafen und Beobachtung der letzten Aktion;
  Bewertung mit --action_clip 1.0. Sonst wie EXP-018.'
