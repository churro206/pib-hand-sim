# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-024
titel: EXP-022 mit geglätteter Aktion (gleitender Mittelwert α = 0,3)
datum: '2026-10-11'
eltern: EXP-022
status: geplant                 # geplant | läuft | ausgewertet | verworfen

# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'EXP-022 ist unruhig (Unruhe 0,36, Regel 0,01), EXP-023 zeigte, dass Strafen die Unruhe eher erhöhen. Ein gleitender
  Mittelwert auf der Aktion (Isaac Lab ShadowHand-OpenAI act_moving_average 0,3, DeXtreme-Linie) glättet, was an den
  Servos ankommt: Unruhe wirksam deutlich < 0,36 bei gleicher Leistung (kein Unterschied ggü. EXP-022). Wichtig für die
  echte Hand (Servos, Sim-to-Real); die Firmware setzt denselben Filter vor die Servos.'
aenderung: 'Aktion vor den Servos geglättet: a_f ← 0,3·a + 0,7·a_f (mdp.FilteredRelativeJointPositionAction, Env
  HeavyMultiProgressFilter, Agent Clip, Task HeavyMultiProgressClipFilter-v0); Bewertung mit --action_filter 0.3
  (experiments.clip_args liest alpha aus env.yaml). Sonst wie EXP-022.
  reward_diag mit EXP-022 s42 (ohne Filter trainiert): 228/256 gehalten, Belohnungsanteile wie ohne Filter.'
bedingungen:
