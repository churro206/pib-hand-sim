# experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-017
titel: Curriculum wie Dexsuite (Schwerkraft und Beobachtungsrauschen nach Erfolg),
  1500 Iterationen
datum: '2026-10-08'
eltern: EXP-013
status: geplant                 # geplant | läuft | ausgewertet | verworfen

# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Ein Curriculum wie Dexsuite (Schwerkraft und Beobachtungsrauschen wachsen
  mit dem Erfolg) erleichtert das Entdecken des Griffs und erlaubt längeres sinnvolles
  Training: Leistung über alle Objekte steigt ggü. EXP-013 (77 %), vor allem am Quader;
  zudem weniger Seeds, die gar nicht greifen lernen.'
aenderung: 'Curriculum wie Dexsuite (Task HeavyMultiADR-v0, adr_curriculum.py): Schwierigkeit
  0–10 je Umgebung nach Erfolg (gehalten, Kipp ≤ 45°), Schwerkraft 0 → 9,81 m/s²,
  Rauschen der Gelenkwinkel 0 → ±0,1 rad; FSR ohne Rauschen. Dazu 1500 statt 300 Iterationen,
  weil das Curriculum Zeit braucht (EXP-011: 1500 It. allein ohne Wirkung). Bewertung
  ohne Curriculum (volle Schwerkraft, kein Rauschen).'
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d6
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: zylinder_d8_seitlich
  objekt: Zylinder Ø 8 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d8
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: quader_seitlich
  objekt: Quader 7 × 7 × 20 cm (±10 %), Fläche zur Hand ±15°, 0,05–0,2 kg (Benchmark)
  objekt_id: quader_7x7x20
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: flasche_seitlich
  objekt: Flasche Ø 7 × 25 cm (±10 %), 0,05–0,2 kg (Testobjekt, nie trainiert — Höhe
    außerhalb des Trainings)
  objekt_id: flasche_d7x25
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: saftpackung_seitlich
  objekt: Saftpackung 9 × 6 × 19 cm (±10 %), schmale Seite zur Hand ±15°, 0,05–0,2
    kg (Testobjekt, nie trainiert)
  objekt_id: saftpackung_9x6x19
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
protokoll: eval-v1
