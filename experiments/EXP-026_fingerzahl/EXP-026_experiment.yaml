# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-026
titel: EXP-022 mit Belohnung nach Zahl der Finger am Objekt
datum: '2026-10-11'
eltern: EXP-022
status: geplant                 # geplant | läuft | ausgewertet | verworfen

# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'EXP-022 greift mit Daumen + ~2 Fingern (2,9–3,8 im Mittel, je Seed andere), die Regel mit allen fünf. Der Term aus
  EXP-005 (damals mit fehlerhafter Annäherung, eval-v1) auf der heutigen Basis: mehr Finger am Objekt (≥ 4), weniger
  Kraft je Finger, robuster bei schweren YCB-Objekten; Leistung mindestens gleich (Kraftgriff wie RobustDexGrasp:
  Kontaktbelohnung je Glied).'
aenderung: 'Belohnungsterm finger_count = 1 · (Finger mit Objektkontakt > 1 N)/4 · 𝟙[Daumen in Kontakt], ganze Episode
  (mdp.fingers_in_contact wie EXP-005; Env HeavyMultiProgressFingers, Agent Clip). Sonst wie EXP-022.
  reward_diag mit EXP-022 s42: finger_count 0,38/0,47 je s ggü. Gegengriff 0,39/0,49.'
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d6
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: zylinder_d8_seitlich
  objekt: Zylinder Ø 8 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d8
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: quader_seitlich
