  objekt_id: quader_7x7x20
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: flasche_seitlich
  objekt: Flasche Ø 7 × 25 cm (±10 %), 0,05–0,2 kg (Testobjekt, nie trainiert — Höhe
