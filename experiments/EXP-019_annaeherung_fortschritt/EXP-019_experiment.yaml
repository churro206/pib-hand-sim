# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-019
titel: Annäherung je Fingerspitze als Fortschritt (wie NVIDIA AllegroKuka/DexPBT)
datum: '2026-10-09'
eltern: EXP-018
status: trainiert
# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Ohne Signal fürs Zugreifen lernen die meisten Seeds nie zu greifen (EXP-018:
  1/5; der alte Annäherungsterm maß den Unterarmansatz, ADR-022). Ein Fortschrittsterm
  je Fingerspitze wie bei NVIDIA AllegroKuka/DexPBT belohnt jedes Annähern der Spitzen
  in der Greifphase → mehr Seeds entdecken den Griff. Erwartet: Zuverlässigkeit deutlich
  über EXP-018 (≥ 6/10 erfolgreich, EXP-018 mit 10 Seeds als Vergleich), Leistung
  im Bereich von EXP-018/EXP-013.'
aenderung: 'Annäherung ersetzt: fingertips_to_object (Dexsuite-Kopie mit Standardargument-Fehler,
  maß alle Handkörper) → mdp.FingertipProgress: je Fingerspitze Σ max(kleinster bisheriger
  Abstand zur Objektmitte − aktueller, 0), je Schritt auf 5 cm gekappt, nur vor dem
  Absenken, Gewicht 500 (reward_diag: greifende Policy 0,52/s vor dem Absenken, Gegengriff
  0,36/s). Task HeavyMultiProgress-v0, sonst wie EXP-018. 10 Seeds (Zuverlässigkeit
  ist die Hauptfrage).'
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d6
