# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-008
titel: Objekttransfer ohne Nachtraining (EXP-004-Policy an Becher und Milchpackung)
datum: '2026-10-07'
eltern: EXP-004
status: ausgewertet
# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Der Zylinder-Spezialist (EXP-004, Pinzettengriff Daumen + 1 Finger) überträgt ohne
  Nachtraining nur teilweise auf andere Objekte seiner Kategorie: Aufgabenerfolg (≤ 45°) an
  Zylinder Ø 8 cm und Quader 7 × 7 × 20 cm jeweils > 0, aber mehr als 10 Prozentpunkte unter der
  Referenz Ø 6 cm; Fingernutzung bleibt bei ~2. Vorab gesehen: Fenstertest Quader, nur Seed 42,
  32 Episoden — 47 % (Referenz Seed 42: 88 %); nach dem Festlegen Fenstertest Ø 8 cm: 62,5 %. Folge: ≤ 10 PP Abstand → Training am Zylinder reicht
  (HORA), sonst Training mit Objektvielfalt (EXP-010).'

aenderung: 'Kein Training — Bewertung der EXP-004-Läufe unter zwei weiteren Objekten (Objektkatalog
  env_cfg.OBJECTS, Oberfläche 3,5 cm vor der Handfläche, Masse wie Training); Referenz ist die
  bisherige Bedingung (vorhandene Bewertungen, nicht neu gerechnet).'

bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg (Training, Referenz)
  objekt_id: zylinder_d6
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: zylinder_d8_seitlich
  objekt: Zylinder Ø 8 cm (±10 %), 15 cm, 0,05–0,2 kg (dicke Dose/Becher)
  objekt_id: zylinder_d8
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: quader_seitlich
  objekt: Quader 7 × 7 × 20 cm (±10 %), Fläche zur Hand ±15°, 0,05–0,2 kg (Milchpackung)
  objekt_id: quader_7x7x20
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
protokoll: eval-v1
entscheidungsregel: standard    # README → „Statistik und Entscheidungsregel“

