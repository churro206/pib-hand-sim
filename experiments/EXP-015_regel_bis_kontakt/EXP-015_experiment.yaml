# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-015
titel: 'Regel-Baseline: schließen bis Kontakt, taktiler Reflex (kein RL)'
datum: '2026-10-08'
eltern: EXP-013
status: bewertet
# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Ein taktiler Reflexgriff (schließen bis FSR-Kontakt, dann gezielt nachdrücken)
  ist die stärkere Regel: besser als EXP-014 bei Kippen und am Quader; RL (EXP-013)
  liegt in der Leistung trotzdem darüber.'
aenderung: 'Kein RL: wie EXP-014, aber je Finger ab FSR > 1 N nur noch um einen festen
  Winkel nachdrücken (Hsiao et al. 2010, contact-reactive grasping). Raster nachdruck
  2°/4°/5,7° (Aktion begrenzt auf 0,1 rad = 5,7° je Schritt) bei schliessen 0,4, Seed
  2000 gewählt, final eval-v1.'
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d6
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: zylinder_d8_seitlich
  objekt: Zylinder Ø 8 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d8
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: quader_seitlich
  objekt: Quader 7 × 7 × 20 cm (±10 %), Fläche zur Hand ±15°, 0,05–0,2 kg (Benchmark)
  objekt_id: quader_7x7x20
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: flasche_seitlich
  objekt: Flasche Ø 7 × 25 cm (±10 %), 0,05–0,2 kg (Testobjekt, nie trainiert — Höhe
    außerhalb des Trainings)
  objekt_id: flasche_d7x25
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: saftpackung_seitlich
  objekt: Saftpackung 9 × 6 × 19 cm (±10 %), schmale Seite zur Hand ±15°, 0,05–0,2
    kg (Testobjekt, nie trainiert)
  objekt_id: saftpackung_9x6x19
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
protokoll: eval-v2
entscheidungsregel: standard    # README → „Statistik und Entscheidungsregel“

# --- Training ---
training: null
fenstertest: false
