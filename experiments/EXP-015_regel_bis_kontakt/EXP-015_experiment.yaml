ergebnis: 'Regel „bis Kontakt“ (nachdruck 2° aus 2/4/5,7°): Leistung 68 % (Ø 6 76
  · Ø 8 70 · Quader 51), Flasche 72 · Saft 62 %; mehr Nachdrücken war im Raster schlechter.'
urteil: ""                      # bestätigtes Urteil (besser | schlechter | kein Unterschied | Leitplanke verletzt)
schluss: 'Entwurf: Der taktile Reflex ist nicht besser als „alle schließen“ — vermutlich
