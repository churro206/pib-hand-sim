# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-023
titel: EXP-022 mit Strafe auf die Verschiebung in der Tischebene
datum: '2026-10-10'
eltern: EXP-022
status: trainiert
# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Die Policies der Linie mit 18 Formen ziehen das Objekt beim Zugreifen ~13 cm in der Tischebene
  Richtung Unterarm (EXP-022 s42, Ø 6: Objektweg 142 mm), weil nichts in der Belohnung die Lage in xy hält.
  Eine Strafe auf die Verschiebung wie Cross-Embodiment Dexterous Grasping (Yuan et al. 2024) senkt den Objektweg
  deutlich (erwartet < 60 mm), ohne Leistung und Zuverlässigkeit zu verlieren (kein Unterschied ggü. EXP-022).'
aenderung: 'Belohnungsterm object_xy = −4 · ‖xy − xy_Start‖ (Objektmitte, Start = Lage bei 0,1 s, gekappt bei 0,2 m),
  ganze Episode (mdp.object_xy_displacement, Task HeavyMultiProgressClipXY-v0: Env HeavyMultiProgressXY, Agent
  PibGraspPPORunnerCfg_Clip). Gewicht so, dass 13 cm Ziehen etwa den Gegengriff (0,5/s) aufwiegt; reward_diag mit
  EXP-022 s42: object_xy −0,35/s vor dem Absenken, −0,59/s in der Haltephase, Gegengriff 0,39/0,49/s. Sonst wie EXP-022.'
bedingungen:
