# experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-013
titel: Objektvielfalt im Training (18 Formen der Kategorie seitlich)
datum: '2026-10-08'
eltern: EXP-006
status: trainiert
# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Training an 18 Formen der Kategorie (statt nur am Ø-6-cm-Zylinder) hebt den Engpass Quader
  (EXP-006: Leistung 55 %) deutlich (≥ +15 PP), die Leistung über die Benchmark-Objekte ist mindestens gleich
  (P(besser) nicht gesichert < 0,5) und die Testobjekte (Flasche, Saftpackung, nie trainiert) liegen über
  EXP-006. Erwartet ebenfalls: mehr Finger am Objekt (dicke/kantige Formen erzwingen Kraftgriff).'
aenderung: 'Objektvielfalt wie Dexsuite (MultiAssetSpawnerCfg), Task HeavyMulti-v0: je Umgebung eine von 18
  Formen (10 Zylinder Ø 5–9 cm × 15/20 cm, 8 Quader 6–8 cm × 16/20 cm), Startlage je Umgebung aus der
  Bounding Box (Oberfläche 3,5 cm vor der Handfläche), Drehung ±15° für alle. Notwendig dazu (sonst ~1/3
  der Starts mit Überlappung, _check_multi.py): Startbeugung der Finger 0–4° statt 0–15°, Handgelenk
  −3–0° statt −10–0°; Daumen unverändert. Belohnung unverändert (inkl. des Annäherungsfehlers, wie EXP-006).
  Szenenprüfung statt Fenstertest (Leon remote): isaac_sim/tools/_check_multi.txt + Bilder.'
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d6
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: zylinder_d8_seitlich
  objekt: Zylinder Ø 8 cm (±10 %), 15 cm, 0,05–0,2 kg (Benchmark)
  objekt_id: zylinder_d8
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: quader_seitlich
  objekt: Quader 7 × 7 × 20 cm (±10 %), Fläche zur Hand ±15°, 0,05–0,2 kg (Benchmark)
  objekt_id: quader_7x7x20
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: flasche_seitlich
  objekt: Flasche Ø 7 × 25 cm (±10 %), 0,05–0,2 kg (Testobjekt, nie trainiert — Höhe außerhalb des Trainings)
  objekt_id: flasche_d7x25
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: saftpackung_seitlich
  objekt: Saftpackung 9 × 6 × 19 cm (±10 %), schmale Seite zur Hand ±15°, 0,05–0,2 kg (Testobjekt, nie trainiert)
  objekt_id: saftpackung_9x6x19
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
protokoll: eval-v1
entscheidungsregel: standard    # README → „Statistik und Entscheidungsregel“

# --- Training ---
training:
  task: Pib-Grasp-Hand-Left-HeavyMulti-v0
  iterationen: 300
  umgebungen: 1024
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  zusatz_args: []
fenstertest: false              # ersetzt durch Szenenprüfung _check_multi.py (Leon remote)

