ergebnis: Aufgabenerfolg 69,4 % [21,9–94,4], IQM 80,7 %, Fehlschlag-Seeds 33 % (Seeds
  92/22/95 %); Haltequote 92,8 %; Kippwinkel 26°, Unterarm 26° wie EXP-004. Finger
