# EXP-NNN_experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-012
titel: Belohnung wie Dexsuite (Annäherung mit Handfläche, Position 3D zur Startposition)
datum: '2026-10-08'
eltern: EXP-006
status: trainiert
# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Mit der Belohnung so nah an Dexsuite wie die Aufgabe erlaubt hört das Anheben vor dem
  Absenken auf (EXP-006: 3–6 cm; im Verlaufsdiagramm bleibt die Objekthöhe nahe der Starthöhe), der
  Kippwinkel sinkt und der Aufgabenerfolg über alle Objekte ist mindestens gleich (Leaderboard-IQM
  ≥ EXP-006, P(EXP-006 > EXP-012) nicht gesichert). Risiko: ohne Schaufelgriff sinkt die Haltequote.'
aenderung: 'Eigenbau-Belohnung zurück auf Dexsuite (RewardsDexsuiteCfg, Task HeavyDexsuite-v0):
  Annäherung = Dexsuite object_ee_distance über Handfläche + Fingerspitzen (behebt zugleich, dass
  unsere Kopie alle Körper inkl. Unterarm maß — Standardargument-SceneEntityCfg nicht aufgelöst);
  Positionsverfolgung = 3D-Abstand zur Startposition std 0,2 (statt Absinken in z, einseitig, 0,02);
  Erfolg = 3D-Abstand pos_std 0,1 × Kipp 0,5 (statt 0,02). Startposition bei 0,1 s eingefroren.
  Größenordnung geprüft (isaac_sim/tools/_reward_diag.txt).'
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg (Training, Referenz)
  objekt_id: zylinder_d6
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: zylinder_d8_seitlich
  objekt: Zylinder Ø 8 cm (±10 %), 15 cm, 0,05–0,2 kg (dicke Dose/Becher)
  objekt_id: zylinder_d8
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: quader_seitlich
  objekt: Quader 7 × 7 × 20 cm (±10 %), Fläche zur Hand ±15°, 0,05–0,2 kg (Milchpackung)
  objekt_id: quader_7x7x20
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
protokoll: eval-v1
entscheidungsregel: standard    # README → „Statistik und Entscheidungsregel“

# --- Training ---
