# experiment.yaml — Vorlage (Ablauf und Metriken: experiments/README.md)
id: EXP-011
titel: EXP-006 mit 1500 Iterationen (längeres Training)
datum: '2026-10-07'
eltern: EXP-006
status: geplant                 # geplant | läuft | ausgewertet | verworfen

# --- 1. Planen (vor dem Start festlegen, danach nicht mehr ändern) ---
hypothese: 'Bei 300 Iterationen steigt die Trainings-Belohnung von EXP-006 noch (Seeds 43/44). Mit 1500 Iterationen steigt der Aufgabenerfolg (≤ 45°) an Ø 8 cm und Quader gegenüber EXP-006 (EXP-009), am Referenzzylinder Ø 6 cm bleibt er gleich (wie EXP-007 ggü. EXP-004).'
aenderung: 'Nur Trainingsdauer: 1500 statt 300 Iterationen (Lift-Rezept), sonst wie EXP-006 (Task Heavy-v0). Bewertung direkt unter allen drei Objekten.'
bedingungen:
- name: zylinder_seitlich
  objekt: Zylinder Ø 6 cm (±10 %), 15 cm, 0,05–0,2 kg (Training, Referenz)
  objekt_id: zylinder_d6
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: zylinder_d8_seitlich
  objekt: Zylinder Ø 8 cm (±10 %), 15 cm, 0,05–0,2 kg (dicke Dose/Becher)
  objekt_id: zylinder_d8
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
- name: quader_seitlich
  objekt: Quader 7 × 7 × 20 cm (±10 %), Fläche zur Hand ±15°, 0,05–0,2 kg (Milchpackung)
  objekt_id: quader_7x7x20
  startpose: seitlich, Daumen oben
  anforderung:
    max_kipp_deg: 45
protokoll: eval-v1
entscheidungsregel: standard    # README → „Statistik und Entscheidungsregel“

# --- Training ---
training:
  task: Pib-Grasp-Hand-Left-Heavy-v0
  iterationen: 1500
  umgebungen: 1024
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
  zusatz_args: []
fenstertest: false

# --- automatisch (experiments.py run) ---
commit: null
laeufe: []

# --- 7. Dokumentieren & Entscheiden (nach der Auswertung, von Hand) ---
ergebnis: ""                    # Kurzfassung der Zahlen
urteil: ""                      # bestätigtes Urteil (besser | schlechter | kein Unterschied | Leitplanke verletzt)
